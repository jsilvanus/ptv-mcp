name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ptv_mcp
          POSTGRES_PASSWORD: ptv_mcp_dev
          POSTGRES_DB: ptv_mcp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptv_mcp -d ptv_mcp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ptv_mcp:ptv_mcp_dev@localhost:5432/ptv_mcp_dev
      MASTER_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      JWT_SECRET: OTA5ODc2NTQzMjEwOTg3NjU0MzIxMDk4NzY1NDMyMTA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix web run lint

      # The GitHub Actions postgres *service container* has no equivalent
      # of docker-compose's docker-entrypoint-initdb.d wiring, so the
      # one-time role bootstrap is run explicitly here instead.
      - run: PGPASSWORD=ptv_mcp_dev psql -h localhost -U ptv_mcp -d ptv_mcp_dev -f scripts/bootstrap-roles.sql
      - run: npm run db:migrate
      - run: npm run test:integration

      - run: npm run build
      - run: npm --prefix web run build
      - run: DATABASE_URL=postgresql://placeholder MASTER_ENCRYPTION_KEY=placeholder JWT_SECRET=placeholder docker compose -f docker-compose.production.yml config
      - run: docker build .
